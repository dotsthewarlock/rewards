name: Companion synthetic browser verification
on:
  push:
    branches: [companion-dev]
    paths: ['companion/**', '.github/workflows/companion-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix companion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python companion/tests/browser_test.py
      - run: npm run build:bookmarklet --prefix companion
      - run: python companion/scripts/package-development.py
      - run: python companion/tests/discovery_browser_test.py
        env:
          COMPANION_EXTENSION_DIR: companion/.build/packaged-extension
      - run: python companion/tests/bookmarklet_browser_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: companion-development-${{ github.sha }}
          path: companion/.build/development/
          if-no-files-found: error
          retention-days: 7
