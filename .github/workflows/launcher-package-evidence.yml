name: One-time read-only V0.6 activation evidence
on:
  push:
    branches: [launcher-package-verification]
permissions:
  contents: read
  actions: read
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run actual activation gate after staged deployment and verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for id in 46071696392 46071696604; do
            for attempt in $(seq 1 36); do
              result=$(gh api --method GET repos/dotsthewarlock/rewards/actions/runs/"$id" --jq '[.head_sha,.head_branch,.status,.conclusion]|join(" ")')
              case "$result" in
                "1bba75beb835bfaf971bdf7c294461cfb9e0cd32 main completed success") break ;;
                "1bba75beb835bfaf971bdf7c294461cfb9e0cd32 main completed "*) echo "Staged deployment gate failed"; exit 1 ;;
                "1bba75beb835bfaf971bdf7c294461cfb9e0cd32 main "*) sleep 10 ;;
                *) echo "Unexpected run identity"; exit 1 ;;
              esac
              test "$attempt" != 36
            done
          done
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = 1bba75beb835bfaf971bdf7c294461cfb9e0cd32
          git worktree add --detach "$RUNNER_TEMP/launcher-main" FETCH_HEAD
          cd "$RUNNER_TEMP/launcher-main"
          python companion/launcher/tools/publication.py activate --version 0.6.0-dev-de3cb5d39410
          test "$(git diff --name-only)" = companion/launcher/channels.json
          python - <<'PY'
          import base64, pathlib, hashlib
          data=pathlib.Path("companion/launcher/channels.json").read_bytes()
          print("VERIFIED_ACTIVATION_MANIFEST:"+base64.b64encode(data).decode())
          print("VERIFIED_ACTIVATION_SHA256:"+hashlib.sha256(data).hexdigest())
          PY
